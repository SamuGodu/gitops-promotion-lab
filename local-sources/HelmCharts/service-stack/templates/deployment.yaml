{{- if and .Values.cacheRequired (not .Values.cache.enabled) }}
{{- fail "cache is required by this application; enable the dependency" }}
{{- end }}
apiVersion: apps/v1
kind: {{ .Values.workload.kind }}
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if eq .Values.workload.kind "StatefulSet" }}
  serviceName: {{ .Release.Name }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- if .Values.cache.enabled }}
            - name: CACHE_SERVICE
              value: "{{ .Release.Name }}-cache"
            {{- end }}
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: password
          resources:
            {{- toYaml .Values.resources | nindent 16 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
      {{- end }}
