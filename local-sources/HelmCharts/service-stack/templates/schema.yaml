{{- if .Values.schema.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-schema-plan
  namespace: {{ .Release.Namespace }}
  labels:
    practice.example.invalid/schema-plan: "true"
data:
  currentVersion: {{ .Values.schema.currentVersion | quote }}
  requiredVersion: {{ .Values.schema.requiredVersion | quote }}
  migrationEnabled: {{ .Values.migration.enabled | quote }}
  migrationTarget: {{ .Values.migration.targetVersion | quote }}
{{- if .Values.migration.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-v{{ .Values.migration.targetVersion }}
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ .Values.migration.image }}
          command: [schema-tool, migrate]
          args: ["--target", {{ .Values.migration.targetVersion | quote }}]
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: password
{{- end }}
{{- end }}
