replicaCount: 1
image:
  repository: registry.example.invalid/demo-web
  tag: ""
  pullPolicy: IfNotPresent
database:
  url: REPLACE_BY_OVERLAY
  existingSecret: app-db
service:
  port: 8080
persistence:
  enabled: true
  existingClaim: app-data
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

workload:
  kind: Deployment
cache:
  enabled: false
  image:
    repository: registry.example.invalid/demo-cache
    tag: "0.8.0"
cacheRequired: false
schema:
  enabled: false
  currentVersion: 1
  requiredVersion: 1
migration:
  enabled: false
  targetVersion: 2
  image: registry.example.invalid/schema-tool:1.0.0
