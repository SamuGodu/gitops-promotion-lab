# Teaching manifest only: no secret operator or external service is contacted.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db-es
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fictional-store
    kind: ClusterSecretStore
  target:
    name: app-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: REPLACE_BY_OVERLAY
