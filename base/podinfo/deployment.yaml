apiVersion: apps/v1
kind: Deployment

metadata:
  name: podinfo
  labels:
    app.kubernetes.io/name: podinfo
    app.kubernetes.io/part-of: gitops-promotion-lab

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo

  template:
    metadata:
      labels:
        app.kubernetes.io/name: podinfo
        app.kubernetes.io/part-of: gitops-promotion-lab

    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.14.1
          imagePullPolicy: IfNotPresent

          env:
            - name: PODINFO_UI_MESSAGE
              value: "GitOps promotion lab"
            - name: PODINFO_UI_COLOR
              value: "#34577c"

          ports:
            - name: http
              containerPort: 9898
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
