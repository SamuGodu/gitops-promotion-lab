apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-resource-demo
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        scenario: {{ .Values.scenario | quote }}

    spec:
      containers:
        - name: resource-demo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command:
            - python
            - -c

{{ if eq .Values.scenario "cpu" }}
          args:
            - "while True: pass"
{{ else if eq .Values.scenario "memory" }}
          args:
            - "import time; allocation = bytearray({{ .Values.workload.memoryMi }} * 1024 * 1024); time.sleep(86400)"
{{ else }}
          args:
            - "import time; print('Resource demo running in idle mode'); time.sleep(86400)"
{{ end }}

          resources:
{{ toYaml .Values.resources | nindent 12 }}
