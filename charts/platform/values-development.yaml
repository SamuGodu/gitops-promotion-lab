podinfo:
  enabled: true
  replicaCount: 1
  environment: development

  config:
    message: "Development configured by parent chart"
    color: "#2e7d32"

storageDemo:
  enabled: true
  replicaCount: 1

  persistence:
    storageClassName: standard
    accessMode: ReadWriteOnce
    size: 128Mi
    mountPath: /data

resourceDemo:
  enabled: true
  replicaCount: 1
  scenario: idle

  workload:
    memoryMi: 96

  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi
