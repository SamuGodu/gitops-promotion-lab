apiVersion: v2
name: gitops-platform
description: Parent chart for the GitOps promotion lab
type: application
version: 0.3.0
appVersion: "1.0.0"

dependencies:
  - name: podinfo-helm
    alias: podinfo
    version: 0.1.0
    repository: "file://../podinfo"
    condition: podinfo.enabled

  - name: storage-demo
    alias: storageDemo
    version: 0.1.0
    repository: "file://../storage-demo"
    condition: storageDemo.enabled

  - name: resource-demo
    alias: resourceDemo
    version: 0.1.0
    repository: "file://../resource-demo"
    condition: resourceDemo.enabled
