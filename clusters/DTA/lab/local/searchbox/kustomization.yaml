apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: searchbox-dta
resources:
  - ../../../../../base/searchbox
  - pv.yaml
  - pvc.yaml
  - route.yaml
patches:
  - target:
      kind: ExternalSecret
      name: app-db-es
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: searchbox-dta-password
