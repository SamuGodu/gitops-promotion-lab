apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scheduler-dta
  namespace: argocd
  labels:
    environment: dta
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: scheduler-dta
  sources:
    - repoURL: https://git.example.invalid/practice/ops.git
      targetRevision: develop
      path: local-sources/HelmCharts/demo-worker
      helm:
        releaseName: scheduler
        valueFiles:
          - $value/base/scheduler/values.yaml
          - $value/clusters/DTA/lab/local/scheduler/values.yaml
    - repoURL: https://git.example.invalid/practice/ops.git
      targetRevision: develop
      path: clusters/DTA/lab/local/scheduler
      ref: value
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
