apiVersion: v1
kind: PersistentVolume
metadata:
  name: notebook-dta-pv
  labels:
    app: notebook
    environment: dta
spec:
  storageClassName: ""
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: storage-dta.example.invalid
    path: /practice/notebook
