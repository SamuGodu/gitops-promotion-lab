apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: podinfo

resources:
  - ../../../base/podinfo

labels:
  - pairs:
      environment: production
    includeSelectors: true

patches:
  - path: deployment-patch.yaml

configMapGenerator:
  - name: podinfo-config
    behavior: replace
    literals:
      - "PODINFO_UI_MESSAGE=Production environment"
      - "PODINFO_UI_COLOR=#1565c0"