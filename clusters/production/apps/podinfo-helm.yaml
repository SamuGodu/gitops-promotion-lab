apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: podinfo-helm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: production-apps
    environment: production

spec:
  project: default

  source:
    repoURL: https://gitlab.com/SamuGodu/gitops-promotion-lab.git
    targetRevision: main
    path: charts/platform

    helm:
      releaseName: platform-prod
      valueFiles:
        - values-production.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo-helm

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
