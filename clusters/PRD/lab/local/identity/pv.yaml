apiVersion: v1
kind: PersistentVolume
metadata:
  name: identity-prd-pv
  labels:
    app: identity
    environment: prd
spec:
  storageClassName: ""
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: storage-prd.example.invalid
    path: /practice/identity
