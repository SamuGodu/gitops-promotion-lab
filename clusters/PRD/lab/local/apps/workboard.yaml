apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workboard-prd
  namespace: argocd
  labels:
    environment: prd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: workboard-prd
  sources:
    - repoURL: registry.example.invalid
      chart: charts/demo-web
      targetRevision: 1.0.0
      helm:
        releaseName: workboard
        valueFiles:
          - $value/base/workboard/values.yaml
          - $value/clusters/PRD/lab/local/workboard/values.yaml
    - repoURL: https://git.example.invalid/practice/ops.git
      targetRevision: main
      path: clusters/PRD/lab/local/workboard
      ref: value
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
