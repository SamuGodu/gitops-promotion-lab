apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: scheduler-stg
resources:
  - ../../../../../base/scheduler
patches:
  - target:
      kind: ExternalSecret
      name: app-db-es
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: scheduler-stg-password
