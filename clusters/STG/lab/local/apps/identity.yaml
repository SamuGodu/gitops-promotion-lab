apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity-stg
  namespace: argocd
  labels:
    environment: stg
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: identity-stg
  sources:
    - repoURL: registry.example.invalid
      chart: charts/service-stack
      targetRevision: 2.0.0
      helm:
        releaseName: identity
        valueFiles:
          - $value/base/identity/values.yaml
          - $value/clusters/STG/lab/local/identity/values.yaml
    - repoURL: https://git.example.invalid/practice/ops.git
      targetRevision: develop
      path: clusters/STG/lab/local/identity
      ref: value
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
