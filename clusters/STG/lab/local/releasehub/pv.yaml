apiVersion: v1
kind: PersistentVolume
metadata:
  name: releasehub-stg-pv
  labels:
    app: releasehub
    environment: stg
spec:
  storageClassName: ""
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: storage-stg.example.invalid
    path: /practice/releasehub
