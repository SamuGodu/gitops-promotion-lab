apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-route
spec:
  hostnames: [notebook-stg.example.invalid]
  parentRefs:
    - name: lab-gateway
      namespace: lab-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: notebook
          port: 8080
