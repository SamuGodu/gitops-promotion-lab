apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: podinfo

resources:
  - ../../../base/podinfo

labels:
  - pairs:
      environment: development
    includeSelectors: true

patches:
  - path: deployment-patch.yaml

configMapGenerator:
  - name: podinfo-config
    behavior: replace
    literals:
      - "PODINFO_UI_MESSAGE=Development environment"
      - "PODINFO_UI_COLOR=#2e7d32"